; Qwen3.8-27B router recipes — llama-server "models/models.ini" (strix-halo-vulkan fork)
; ---------------------------------------------------------------------------
; Section name = the model name clients request, e.g.  "model": "Qwen38-27B-balanced"
; in /v1/chat/completions (or ?model=... for GET endpoints like /props).
; Names are plain ROLE words (quality@NNk | balanced | speed | vision) for
; first-timer clarity. ONE alias exists on purpose: Qwen38-27B (on balanced
; below) is the movable "my default model" pointer — see the comment there;
; it also shows in the WebUI picker, which is accepted for this one entry.
; Model/mmproj paths are REPO-RELATIVE (./file.gguf): the router resolves them
; against this repo's root, so this file works on any box after a plain clone.
; ---------------------------------------------------------------------------
; INTEGRITY: every weight file carries its full sha256 in the comment directly
; above its model=/model-draft=/mmproj= line. ALWAYS verify a file before first
; use on a new box — a corrupted or swapped weight silently degrades quality:
;     sha256sum models/<file>.gguf      # must equal the hash in the comment
; scripts/download_models.sh --check verifies every file at once (12-char
; prefixes there, full hashes here — same values). Measured 2026-08-24.
;
; Recipe sections carry ONLY what distinguishes them (weights file, c, aliases,
; and their overrides of the [*] spec defaults). Everything shared sits in
; [*] above (spec trio + runtime defaults: offload/batch/thread/template —
; operator 2026-08-27, moved off the CLI so sections can diverge). The
; router command line carries only what is genuinely router-wide (f16 KV,
; mlock, metrics, host/port) — per-model speed knobs are section keys now.
;
; PRECEDENCE (router behavior, server-models.cpp ~551 + preset cascade):
;   router CLI > section keys > [*] global keys. A key set BOTH in a section
;   and on the CLI is won by the CLI and the section key is silently dead —
;   that bug is why shared spec keys live in [*] (NOT on the CLI, or no recipe
;   could ever diverge; that's how vision pins spec-type = none and speed pins
;   n-max 5, both overriding [*]).
;
; Key reference: argument names without leading dashes (c = -c, model = -m,
; spec-draft-n-max = --spec-draft-n-max). Extra preset-only keys:
;   load-on-startup = false   -> don't load at boot; first request pays the load
;                               (measured ~6 s warm, up to ~13 s cold page cache);
;                               true preloads at (re)start — models-max caps how
;                               many recipes may set it (1 here: balanced only)
;   stop-timeout    = N secs  -> grace before forced unload after an unload request
;   LLAMA_ARG_ALIAS = a,b     -> extra names this recipe also answers to
;
; Recipes (see README "Recommended configs (per goal)" for the full table):
;   quality@NNk  Q8 window dial: @64k (default) | @96k (fence) | @128k | @192k | @256k —
;               same weights/quality/speed at every NN (allocation-flat);
;               NN sets the window + its RAM price (~45 -> ~61 GiB)
;   balanced     Q6 @ 128k default (flat to 256k) — daily driver, ~20 t/s
;   balanced@96k Q6 fence variant — same reasoning as quality@96k, fastest
;                decode behind the physical window cap
;   coding       Q6 @ 128k + reasoning-budget 2048 — balanced + the bounded-
;                agent guard (empty-answer insurance; see its section comment)
;   speed        Q5 @ 64k, n-max 5               — fastest decoder, ~23 t/s
;   vision       Q6 + mmproj, spec-type = none   — the only image recipe, ~8.4 t/s
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; [*] = global preset: keys here apply to EVERY section below, and sections
; override [*] key-by-key (precedence overall: router CLI > section > [*]).
; That makes [*] the right home for shared spec keys — the CLI must NOT carry
; them (CLI silently beats sections — see PRECEDENCE above, lesson #8).
; ---------------------------------------------------------------------------
[*]
; sha256 = 7f1c9a31a6ed40044c69f6508b50fd63b87abd8e1fb7fe4290303df549153751   (ALWAYS verify: sha256sum models/Qwen3.8-27B-DFlash2-Q8_0.gguf)
model-draft = models/Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
; --- runtime defaults (operator 2026-08-27): moved here from the
; router CLI — these impact each model's speed differently, so they MUST
; be per-model overridable (section key > [*] > CLI; the CLI silently
; beats sections, which is why they left the command line).
ngl = all
ngld = all
fa = on
b = 4096
ub = 4096
np = 1
t = 16
tb = 32
chat-template-file = models/sharp.jinja
jinja = true

[Qwen38-27B-quality@64k]
; Q8_K_XL — the quality family: SAME weights, quality and decode speed at every
; NN (decode is allocation-flat on this hybrid-SSM model — headline finding #1);
; NN only sets the window and its RAM price (~45 -> 61 GiB from @64k to @256k).
; Switch presets per request like a reasoning level; standard clients resend
; history, so a switch mid-session just rebuilds (renews) context after one
; ~6-15 s on-demand load. Caveats: Vulkan deep-prefill dies past ~128k
; POSITIONS (OK at 128,209; death 136,965 in the same-shape 08-22 control;
; the ROCm build survives 215k+ — README 'Vulkan vs ROCm'); big-window loads
; can be slow on an uptimed box (reboot if crawling).
; sha256 = af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q8_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 65536

[Qwen38-27B-quality@96k]
; THE FENCE recipe (2026-08-22; reframed 2026-08-23): same Q8 weights and
; speed as @64k (decode is allocation-flat — the window costs only KV RAM,
; ~48 GiB resident). The 96k window hard-caps max fill at 98,304. Originally
; introduced to keep unattended runs out of the Vulkan deep-fill crash band —
; NO LONGER REQUIRED for that: the crash was root-caused to the amdgpu lockup
; watchdog and this box runs amdgpu.lockup_timeout=-1 (full 262k window
; verified filled, zero errors — see README). Still useful as an OPT-IN fence:
; (a) on default-kernel boxes without the boot param it remains crash
; insurance; (b) even under -1 it keeps sessions in the fast-decode band
; (>= ~13 t/s) and enforces client discipline earlier — every compact pays a
; re-prefill, so pick it when the physical cap is worth more than the last
; 32k of runway. Default policy since 2026-08-23: 128k for both interactive
; AND unattended runs (dream service pinned to quality@128k).
; Pair with an agent compaction threshold <= ~90k if used.
; sha256 = af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q8_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 98304

[Qwen38-27B-quality@128k]
; same weights/window dial one step up (~50 GiB resident)
; sha256 = af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q8_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 131072

[Qwen38-27B-quality@192k]
; window dial (~54 GiB resident). PRACTICAL CAP: content beyond ~128k POSITIONS
; crashes the Vulkan path (measured: 128,209-token fill OK; death at 136,965 in
; the same-shape 08-22 control — and chunked/incremental fills do NOT bypass
; it, the limit is absolute position). Until deep positions are fixed in the
; Vulkan stack, treat @192k/@256k as allocation headroom; usable content is
; ~<=128k (the ROCm build survives 215k+ if you ever need deeper — README
; 'Vulkan vs ROCm').
; sha256 = af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q8_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 196608

[Qwen38-27B-quality@256k]
; the flagship window: the servable ceiling (llama.cpp — mainline and fork
; alike — caps slots at the model's 262144 n_ctx_train; see the parked 1M
; block below). ~61 GiB resident.
; Same practical content cap as @192k (~128k positions, measured) — the big
; allocation is future-proofing for when deep positions are fixed.
; sha256 = af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q8_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 262144

[Qwen38-27B-balanced]
; Q6_K_XL daily driver — best quality/speed balance. c = 131072 default: sized
; for agentic coding sessions (the primary Qwen3.8-27B workload), still
; decode-flat (committed logs results/s3-*: 19.5-20.2 t/s at 64k-256k;
; corrected 2026-08-23 - the old 28-29 figures traced to no committed evidence) at ~+5 GiB RAM over 64k — and it is the
; largest window that stays inside the measured-safe ~128k content ceiling
; (128,209 positions OK; Vulkan death at 136,965 in the same-shape 08-22
; control — the window itself keeps sessions out of the crash zone). The old
; Q6-65K-fast names route here too — that recipe was this exact config family
; under a second name.
; Qwen38-27B = the "default model" pointer: a stable client-facing name that
; always routes to whichever section carries this alias line. To change the
; default, MOVE this line (and ideally load-on-startup below with it) to the
; recipe you prefer — clients pinned to "Qwen38-27B" (pi's models.json, curl
; scripts, WebUI presets) never change. Alias changes need a service restart:
; ?reload=1 re-reads presets only for NON-running recipes (server-models.cpp
; skips is_running()), so a move while the source recipe is loaded is ignored.
; Same for NEWLY ADDED sections: the hot-reload path did not surface
; quality@96k until a restart (verified 2026-08-22) — restart after any
; structural models/models.ini edit.
; "default" is the BLIND-USE alias: any client can send "model": "default"
; and get this recipe without ever querying /v1/models — knowing host:port
; is enough for OpenCode/curl/scripts that hardcode a name. NOTE: omitting
; the model field is NOT accepted (server-models.cpp router_validate_model
; rejects empty names) — clients must send "default" or "Qwen38-27B".
LLAMA_ARG_ALIAS = Qwen38-27B,default
; sha256 = 701d8fa9ed214ab21bfc130cd2a7df19ca89bbef7713e2dfb19f3c63696aa917   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q6_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
; preloaded at service (re)start — the only load-on-startup recipe (models-max 1
; hard-caps these at one): first request after boot skips the ~6-13 s cold load.
; Belongs with the alias above: the "default" recipe should be the hot one.
load-on-startup = true

[Qwen38-27B-balanced@96k]
; THE Q6 FENCE (2026-08-22; reframed 2026-08-23) — same reasoning as
; quality@96k, for the daily driver: identical Q6 weights/quality/speed as
; balanced (decode is allocation-flat; ~43 GiB resident), 96k window hard-caps
; max fill at 98,304. The crash-mitigation rationale is GONE (watchdog fix,
; amdgpu.lockup_timeout=-1 — full window verified); what remains is the
; opt-in value: crash insurance on default-kernel boxes, and the fast-decode
; band (~20 t/s) with earlier compaction discipline under -1. Fastest decoder
; behind the fence (~20 t/s with DFlash2 vs quality's ~17). NOT a speed play
; vs balanced; balanced (with the Qwen38-27B alias + preload) stays the
; default, and 128k is the policy default for interactive AND unattended
; runs since 2026-08-23. Pair with an agent compaction threshold <= ~90k if
; used.
; sha256 = 701d8fa9ed214ab21bfc130cd2a7df19ca89bbef7713e2dfb19f3c63696aa917   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q6_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 98304

[Qwen38-27B-coding]
; THE AGENT-CODING RECIPE (2026-08-23) — balanced's weights/window plus a
; server-side REASONING-BUDGET GUARD, from the measured evidence
; (README "Reasoning levels: cost and quality — measured"):
;   * effort levels (low/medium/xhigh) are STYLE steering, not cost — median
;     thinking tokens are flat across levels (E1); the only reliable cost
;     control is a reasoning budget (budget arm: 8/8 within cap, graceful stop)
;   * thinking inside a bounded max_tokens can eat the whole budget and
;     return NOTHING (finish=length, empty answer — E2c: 60-70% of frontier
;     items failed that way at 4k while off-mode solved 10/10); raising the
;     budget recovered 12/13 at 16k. For agentic coding loops (pi, tool
;     callers) that is the failure to design against.
; Hence: same Q6/c-128k as balanced (code tier is quant-ceiling: 5/5 E2 +
; 10/10 E2b in every cell; decode ~20 t/s), + reasoning-budget = 2048 as the
; DEFAULT cap. 2048 sits well above thinking p90 on hard routine prompts
; (~610-736, E1) so normal work never notices it, while a run-away thinker
; gets the graceful "answer now" stop instead of an empty reply.
; Clients override per request: body reasoning_budget_tokens (thinking_budget
; tokens also accepted) — any N>0 replaces the cap (send e.g. 32768 for
; effectively unrestricted deep work); 0 ends thinking immediately; absence
; or -1 falls back to this 2048. reasoning-budget-message = the injected
; notice (fork --reasoning-budget-message; default none would cut silently).
; Template default effort stays medium (v22.3 safe default) — do NOT pin an
; effort: it doesn't order cost (E1) and per-request reasoning_effort /
; <|think_*|> tags still work through this recipe like any other.
LLAMA_ARG_ALIAS = coding,Qwen3.8-27B-coding
; sha256 = 701d8fa9ed214ab21bfc130cd2a7df19ca89bbef7713e2dfb19f3c63696aa917   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q6_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
reasoning-budget = 2048
reasoning-budget-message = Reasoning budget reached — finish your thinking and answer now.

[Qwen38-27B-speed]
; Q5_K_XL — the fastest decoder on this box (~23 t/s: +10-15% over balanced,
; ~5 GiB lighter resident). The measured quality cost vs Q6: KLD 0.0137 vs
; 0.0073 vs the Q8 reference, top-p agreement 95.5% vs 96.5% — fine for
; prototyping/churn, reach for balanced or quality when it matters.
; n-max 5 is the measured optimum for Q5 (n4 23.6 < n5 24.2 < n6 22.1 under
; rp 1.05; same ordering penalty-free).
; sha256 = 8601193d3d5760c37fb8ce1b43afebc69df5fb24e1fbc5a547c32e2200305276   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q5_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q5_K_XL.gguf
spec-draft-n-max = 5
c = 65536

[Qwen38-27B-vision]
; Q6_K_XL + mmproj-F16 — image input recipe. spec-type = none overrides the
