; --- 1M context (YaRN) — researched, measured, NOT servable on current llama.cpp ---
; Official guidance (unsloth card): 262,144 native, "extensible up to 1,000,000
; tokens" via YaRN -> factor 4.0 from the 262,144 training ctx. Measured
; 2026-08-21: the 1M allocation FITS this box (f16 KV: 100.9 of 122.1 GiB GTT,
; RAM avail 14.3 G; q8_0 KV would be comfortable at ~75 G), but two blockers
; make it dead weight today:
;   1. MAINLINE llama.cpp (not just this fork — identical code verified in a
;      stock clone) caps every slot to n_ctx_train (262,144) with NO yarn
;      exemption -> the KV is allocated but unusable beyond 262k
;      (quality@256k above IS that cap, servable).
;   2. the Vulkan deep-prefill ceiling (vk::DeviceLostError; death at 136,965
;      measured same-shape) blocks prompts beyond ~128k regardless of (1) —
;      the ROCm build is excepted (survives 215k+).
; Do NOT set 512K as a "middle ground": the slot cap applies to ANY c > 262144,
; so a 512K recipe pays ~+18 GiB KV over 256k and still serves a capped 262144
; slot — the same measured trap as 1M below. max-context above (262144) is the
; hard fork ceiling until the cap gains a yarn exemption.
; 1M RAM budget, Q6 targets (f16 MEASURED on a real 1M load; the rest derived
; from GTT deltas at c=110592 scaled linearly — derivation reproduces the f16
; measurement within ~3%):
;   f16 KV  ~104 GiB GTT (MEASURED: 100.9 GiB, RAM avail 14.3 G — cliff edge)
;   q8_0 KV ~72 GiB   q5_1 ~63 GiB   q4_1 ~57 GiB   q4_0 ~56 GiB
; (Q8 target: add ~7 GiB weights — q8_0 ~80 GiB fits; f16 does not.)
; NIAH battery 2026-08-21 (two codes @25%/75% depth, 8k-96k ctx): retrieval
; 40/40 from f16 down to q4_0 — the q8_0 KV pinned below is retrieval-safe.
; Uncomment when upstream exempts yarn from the cap AND the Vulkan stack
; survives deep positions; expected keys:
; [Qwen38-27B-Q6-1M-yarn]
; model = models/Qwen3.8-27B-UD-Q6_K_XL.gguf
; model-draft = models/Qwen3.8-27B-DFlash2-Q8_0.gguf
; spec-type = draft-dflash
; spec-draft-n-max = 6
; rope-scaling = yarn
; rope-scale = 4
; yarn-orig-ctx = 262144
; ctk = q8_0
; ctv = q8_0
; c = 1048576

