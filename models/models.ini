; static cost +~1.2 GB GTT, +~0.6 s load. mmproj must be per-section — the
; router strips a global CLI --mmproj (server-models.cpp unset_reserved_args)
; precisely so each recipe opts in.
; sha256 = 701d8fa9ed214ab21bfc130cd2a7df19ca89bbef7713e2dfb19f3c63696aa917   (ALWAYS verify: sha256sum models/Qwen3.8-27B-UD-Q6_K_XL.gguf)
model = models/Qwen3.8-27B-UD-Q6_K_XL.gguf
; sha256 = cbb841a9ee0636b2ec172f5bb8df2ea8dfeb01e90fe7c6126581d662a0b4e43e   (ALWAYS verify: sha256sum models/mmproj-F16.gguf)
