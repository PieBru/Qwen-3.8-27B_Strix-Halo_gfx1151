; Qwen3.8-27B router recipes — llama-server "models.ini" (strix-halo-vulkan fork)
; ---------------------------------------------------------------------------
; Section name = the model name clients request, e.g.  "model": "Qwen38-27B-balanced"
; in /v1/chat/completions (or ?model=... for GET endpoints like /props).
; Names are plain ROLE words (quality | balanced | speed | vision | max-context)
; for first-timer clarity; the quant/ctx details live in each section's comment.
; Every historical name (Qwen38-27B-Q6-65K-balanced-speed, -Q8-192K-quality,
; -turbo, -fast, ...) keeps working via LLAMA_ARG_ALIAS.
; Model/mmproj paths are REPO-RELATIVE (./file.gguf): the router resolves them
; against this repo's root, so this file works on any box after a plain clone.
;
; ONLY recipe-specific keys live here. Everything shared (f16 KV, -b/-ub 4096,
; -t 16 -tb 32, sharp.jinja template, mlock, GPU offload, metrics) is passed on
; the llama-server command line by run_llama-server.sh --router.
;
; PRECEDENCE (fork behavior, server-models.cpp ~551): the router overlays its
; own CLI args ON TOP of every section — a key set BOTH here and on the CLI is
; won by the CLI and the section key is silently dead. So shared keys go on the
; CLI, divergent keys go here; spec keys (spec-type / spec-draft-n-max /
; model-draft) MUST live here only, or no recipe could ever diverge from the
; rest (that's how vision pins spec-type = none below).
;
; Key reference: argument names without leading dashes (c = -c, model = -m,
; spec-draft-n-max = --spec-draft-n-max). Extra preset-only keys:
;   load-on-startup = false   -> don't load at boot; first request pays the load
;                               (measured ~6 s warm, up to ~13 s cold page cache)
;   stop-timeout    = N secs  -> grace before forced unload after an unload request
;   LLAMA_ARG_ALIAS = a,b     -> extra names this recipe also answers to
;
; Recipes (see README "Recommended configs (per goal)" for the full table):
;   quality      Q8 @ 64k default (ceiling 256k) — correctness first, ~25 t/s
;   balanced     Q6 @ 64k default (flat to 256k) — daily driver, ~29 t/s
;   speed        Q5 @ 64k, n-max 5               — fastest decoder, ~32 t/s
;   vision       Q6 + mmproj, spec-type = none   — the only image recipe, ~8.4 t/s
;   max-context  Q8 @ 262144 (servable ceiling)  — biggest window, ~25 t/s
; ---------------------------------------------------------------------------

[Qwen38-27B-quality]
; Q8_K_XL — correctness first. c = 65536 default; ceiling 256k (decode is
; ctx-flat: 24.7-24.9 t/s measured at 64k/192k/256k; each 3x ctx costs ~+10 GiB
; KV). Deep-prefill still crashes >=128k POSITIONS (Vulkan ceiling) — long
; windows are for serving many/long contexts, not one huge prompt. Long-ctx
; loads can be slow on an uptimed box (fresh boot ~12 s; reboot if it crawls).
LLAMA_ARG_ALIAS = Qwen38-27B-Q8-65K-quality, Qwen38-27B-Q8-192K-quality, Qwen38-27B-Q8-65K-balanced-quality, Qwen38-27B-balanced-quality
model = ./Qwen3.8-27B-UD-Q8_K_XL.gguf
model-draft = ./Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 65536

[Qwen38-27B-balanced]
; Q6_K_XL daily driver — best quality/speed balance. c = 65536 default; decode
; is ctx-flat, raise freely (2026-08-21 ladder, fresh-slot: 28.1 / 29.6 / 29.0 /
; 28.8 / 29.1 t/s at 32k/64k/128k/192k/256k). The old Q6-65K-fast names route
; here too — that recipe was this exact config under a second name.
LLAMA_ARG_ALIAS = Qwen38-27B-Q6-65K-balanced, Qwen38-27B-Q6-65K-balanced-speed, Qwen38-27B-balanced-speed, Qwen38-27B-Q6-65K-fast, Qwen38-27B-fast
model = ./Qwen3.8-27B-UD-Q6_K_XL.gguf
model-draft = ./Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 65536

[Qwen38-27B-speed]
; Q5_K_XL — the fastest decoder on this box (~32 t/s: +10% over balanced,
; ~5 GiB lighter resident). The measured quality cost vs Q6: KLD 0.0137 vs
; 0.0073 vs the Q8 reference, top-p agreement 95.5% vs 96.5% — fine for
; prototyping/churn, reach for balanced or quality when it matters.
; n-max 5 is the measured optimum for Q5 (n4 23.6 < n5 24.2 < n6 22.1 under
; rp 1.05; same ordering penalty-free).
LLAMA_ARG_ALIAS = Qwen38-27B-Q5-65K-turbo, Qwen38-27B-turbo
model = ./Qwen3.8-27B-UD-Q5_K_XL.gguf
model-draft = ./Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 5
c = 65536

[Qwen38-27B-vision]
; Q6_K_XL + mmproj-F16 — image input recipe. spec-type = none overrides the
; shared spec flags for THIS section only: image embeddings crash the dflash
; speculative batch (fork bug, 2026-08-21), so vision rides without spec
; decode. Measured 2026-08-21: text decode 8.6 t/s (vs 15-16 t/s same weights
; with dflash — that gap is the missing spec decode, NOT mmproj: mmproj on a
; spec recipe measured decode-neutral); warm 512px image encode < 0.5 s;
; static cost +~1.2 GB GTT, +~0.6 s load. mmproj must be per-section — the
; router strips a global CLI --mmproj (server-models.cpp unset_reserved_args)
; precisely so each recipe opts in.
LLAMA_ARG_ALIAS = Qwen38-27B-Q6-65K-vision
model = ./Qwen3.8-27B-UD-Q6_K_XL.gguf
mmproj = ./mmproj-F16.gguf
spec-type = none
c = 65536

[Qwen38-27B-max-context]
; Q8_K_XL pinned at the servable ceiling — the fork caps every slot at the
; model's 262144 training ctx, so this is the biggest window this stack can
; serve (the 1M YaRN config stays parked at the bottom of this file until the
; fork lifts its cap). Decode stays flat (~24.9 t/s measured at 256k) and
; resident RAM is ~64 GiB (KV dominates). Same two caveats as quality: prompts
; >=128k positions crash the Vulkan deep-prefill path (use the window for many
; long-ish contexts, not one 256k-token prompt), and loads of this size can be
; slow on an uptimed box — fresh boot pays ~15 s, reboot if a load crawls.
model = ./Qwen3.8-27B-UD-Q8_K_XL.gguf
model-draft = ./Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 262144

; --- 1M context (YaRN) — researched, measured, NOT servable on this fork yet ---
; Official guidance (unsloth card): 262,144 native, "extensible up to 1,000,000
; tokens" via YaRN -> factor 4.0 from the 262,144 training ctx. Measured
; 2026-08-21: the 1M allocation FITS this box (f16 KV: 100.9 of 122.1 GiB GTT,
; RAM avail 14.3 G; q8_0 KV would be comfortable at ~75 G), but two fork
; blockers make it dead weight today:
;   1. server-context.cpp caps every slot to n_ctx_train (262,144) with NO
;      yarn exemption -> the KV is allocated but unusable beyond 262k
;      (max-context above IS that cap, servable).
;   2. the Vulkan deep-prefill ceiling (vk::DeviceLostError >=128k positions)
;      blocks prompts beyond ~128k regardless of (1).
; Uncomment when the fork lifts both; expected keys:
; [Qwen38-27B-Q6-1M-yarn]
; model = ./Qwen3.8-27B-UD-Q6_K_XL.gguf
; model-draft = ./Qwen3.8-27B-DFlash2-Q8_0.gguf
; spec-type = draft-dflash
; spec-draft-n-max = 6
; rope-scaling = yarn
; rope-scale = 4
; yarn-orig-ctx = 262144
; ctk = q8_0
; ctv = q8_0
; c = 1048576
