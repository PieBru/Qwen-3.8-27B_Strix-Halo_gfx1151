; Qwen3.8-27B router presets — llama-server "models.ini" (strix-halo-vulkan fork)
; ---------------------------------------------------------------------------
; Section name = the model name clients request, e.g.  "model": "Qwen38-27B-Q6-65K-fast"
; in /v1/chat/completions (or ?model=... for GET endpoints like /props).
; Naming scheme: Qwen38-27B-<QUANT>-<CTX>-<ROLE> so the name says what you get.
;
; ONLY recipe-specific keys live here. Everything shared (DFlash2 draft, f16 KV,
; -b/-ub 4096, -t 16 -tb 32, sharp.jinja template, mlock, GPU offload, metrics)
; is passed on the llama-server command line by run_llama-server.sh --router.
;
; PRECEDENCE (fork behavior, server-models.cpp ~551): the router overlays its
; own CLI args ON TOP of every section — a key set BOTH here and on the CLI is
; won by the CLI and the section key is silently dead. So shared keys go on the
; CLI, divergent keys go here; spec keys (spec-type / spec-draft-n-max /
; model-draft) MUST live here only, or no recipe could ever diverge from the
; rest (that's how vision pins spec-type = none below).
;
; Key reference: argument names without leading dashes (c = -c, model = -m,
; spec-draft-n-max = --spec-draft-n-max). Extra preset-only keys:
;   load-on-startup = false   -> don't load at boot; first request pays the load
;                               (measured ~6 s warm, up to ~13 s cold page cache)
;   stop-timeout    = N secs  -> grace before forced unload after an unload request
;   LLAMA_ARG_ALIAS = a,b     -> extra names this recipe also answers to
;                                (comma-separated; used below to keep the old
;                                short names working for existing clients)
;
; Recipes (see README "Recommended configs (per goal)" for measured numbers):
;   Q5-65K-turbo            Q5 @ 64k, n-max 5 — fast throwaway prototyping, ~23 t/s
;   Q6-65K-fast             Q6 @ 64k          — max-speed recipe (same as
;                                               balanced-speed: allocation 64k-256k
;                                               measured flat, two names for two
;                                               jobs, one config)
;   Q6-65K-balanced-speed   Q6 @ 64k          — daily driver, ~28 t/s fresh-box peak
;   Q8-65K-quality         Q8 @ 64k default  — correctness-first; ctx ceiling
;                         192k (decode-flat; see the section note)
;   Q6-65K-vision           Q6 @ 64k + mmproj — the ONLY image-capable recipe:
;                                               mmproj image tokens break the
;                                               DFlash2 spec-decode path in this
;                                               fork ("failed to process speculative
;                                               batch"), so this section pins
;                                               spec-type = none. Static cost of
;                                               mmproj itself is light (+~1.2 GB
;                                               GTT, +~1 s load, text t/s unchanged)
;                                               but it can't ride the spec recipes.
; ---------------------------------------------------------------------------

[Qwen38-27B-Q5-65K-turbo]
; Q5_K_XL — 2026-08-21 sweep: n-max optimum 5 (n3-n5 plateau ~23 t/s, n7+ drops);
; KV type a statistical tie on Q5 (f16 kept for fidelity + consistency).
LLAMA_ARG_ALIAS = Qwen38-27B-turbo
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q5_K_XL.gguf
model-draft = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 5
c = 65536

[Qwen38-27B-Q6-65K-fast]
; Q6_K_XL max-speed recipe — allocation 64k+ measured free, so same c as the
; daily driver; trim only if you need slots elsewhere.
LLAMA_ARG_ALIAS = Qwen38-27B-fast
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q6_K_XL.gguf
model-draft = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 65536

[Qwen38-27B-Q6-65K-balanced-speed]
; Q6_K_XL daily driver — best sustained decode measured on this box.
LLAMA_ARG_ALIAS = Qwen38-27B-balanced-speed
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q6_K_XL.gguf
model-draft = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 65536
; mmproj experiment 2026-08-21: image tokens crash the dflash speculative
; batch in this fork — vision lives in the Q6-65K-vision section instead.

[Qwen38-27B-Q8-65K-quality]
; Q8_K_XL — the quality recipe. c = 65536 default; the ceiling is 196608
; ("up to 192K"): decode is ctx-flat (measured 24.7 t/s at both 64k and 192k)
; and quality is identical, so one recipe serves both jobs — raise c here when
; a task needs the window (costs +~10 GiB KV per 3x ctx and ~2x load time).
; Reliability note (2026-08-21): 192k loads ran 11.5 s on a fresh boot but
; 200 s+ / one DeviceLost late in a heavy GTT-cycling day while 64k loads
; stayed 4-6 s — on an uptimed, heavily-used box prefer the 64k default and
; reboot before leaning on 192k. Deep-prefill still crashes >=128k positions
; regardless (Vulkan ceiling); 192k is for many-separate/long-context serving.
LLAMA_ARG_ALIAS = Qwen38-27B-balanced-quality, Qwen38-27B-quality, Qwen38-27B-Q8-192K-quality, Qwen38-27B-Q8-65K-balanced-quality
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q8_K_XL.gguf
model-draft = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-DFlash2-Q8_0.gguf
spec-type = draft-dflash
spec-draft-n-max = 6
c = 65536

[Qwen38-27B-Q6-65K-vision]
; Q6_K_XL + mmproj-F16 — image input recipe. spec-type = none overrides the
; shared spec flags for THIS section only: image embeddings crash the dflash
; speculative batch (fork bug, 2026-08-21), so vision rides without spec
; decode. Measured 2026-08-21: text decode 8.6 t/s (vs 15-16 t/s same weights
; with dflash — that gap is the missing spec decode, NOT mmproj: mmproj on a
; spec recipe measured decode-neutral); warm 512px image encode < 0.5 s;
; static cost +~1.2 GB GTT, +~0.6 s load. mmproj must be per-section — the
; router strips a global CLI --mmproj (server-models.cpp unset_reserved_args)
; precisely so each recipe opts in.
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q6_K_XL.gguf
mmproj = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/mmproj-F16.gguf
c = 65536
spec-type = none

