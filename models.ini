; bench fills the ctx; serving 192k with normal prompts is verified).
LLAMA_ARG_ALIAS = Qwen38-27B-quality
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q8_K_XL.gguf
