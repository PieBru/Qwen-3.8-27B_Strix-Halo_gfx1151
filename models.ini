; Qwen3.8-27B router presets — llama-server "models.ini" (strix-halo-vulkan fork)
; ---------------------------------------------------------------------------
; Section name = the model name clients request, e.g.  "model": "Qwen38-27B-Q6-65K-fast"
; in /v1/chat/completions (or ?model=... for GET endpoints like /props).
; Naming scheme: Qwen38-27B-<QUANT>-<CTX>-<ROLE> so the name says what you get.
;
; ONLY recipe-specific keys live here. Everything shared (DFlash2 draft, f16 KV,
; -b/-ub 4096, -t 16 -tb 32, spec-type draft-dflash, sharp.jinja template, mlock,
; GPU offload, metrics) is passed on the llama-server command line by
; run_llama-server.sh --router — command-line beats preset keys, so a key set
; here would win over the CLI only for its own section; don't duplicate shared
; keys here unless you want to diverge one recipe from the rest.
;
; Key reference: argument names without leading dashes (c = -c, model = -m,
; spec-draft-n-max = --spec-draft-n-max). Extra preset-only keys:
;   load-on-startup = false   -> don't load at boot; first request pays ~10 s load
;   stop-timeout    = N secs  -> grace before forced unload after an unload request
;   LLAMA_ARG_ALIAS = a,b     -> extra names this recipe also answers to
;                                (comma-separated; used below to keep the old
;                                short names working for existing clients)
;
; Recipes (see README "Recommended configs (per goal)" for measured numbers):
;   Q5-65K-turbo            Q5 @ 64k, n-max 5 — fast throwaway prototyping, ~23 t/s
;   Q6-65K-fast             Q6 @ 64k          — max-speed recipe (same as
;                                               balanced-speed: allocation 64k-256k
;                                               measured flat, two names for two
;                                               jobs, one config)
;   Q6-65K-balanced-speed   Q6 @ 64k          — daily driver, ~28 t/s fresh-box peak
;   Q8-65K-balanced-quality Q8 @ 64k          — correctness-first default, ~25 t/s
;   Q8-192K-quality         Q8 @ 192k         — final answers / code / synthesis
; ---------------------------------------------------------------------------

[Qwen38-27B-Q5-65K-turbo]
; Q5_K_XL — 2026-08-21 sweep: n-max optimum 5 (n3-n5 plateau ~23 t/s, n7+ drops);
; KV type a statistical tie on Q5 (f16 kept for fidelity + consistency).
LLAMA_ARG_ALIAS = Qwen38-27B-turbo
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q5_K_XL.gguf
c = 65536
spec-draft-n-max = 5

[Qwen38-27B-Q6-65K-fast]
; Q6_K_XL max-speed recipe — allocation 64k+ measured free, so same c as the
; daily driver; trim only if you need slots elsewhere.
LLAMA_ARG_ALIAS = Qwen38-27B-fast
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 65536

[Qwen38-27B-Q6-65K-balanced-speed]
; Q6_K_XL daily driver — best sustained decode measured on this box.
LLAMA_ARG_ALIAS = Qwen38-27B-balanced-speed
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 65536

[Qwen38-27B-Q8-65K-balanced-quality]
; Q8_K_XL default when correctness matters more than latency.
LLAMA_ARG_ALIAS = Qwen38-27B-balanced-quality
model = /home/piero/Piero/Work/Qwen-3.8-27B_Strix-Halo_gfx1151/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 65536

[Qwen38-27B-Q8-192K-quality]
