# fleet/haproxy.cfg — transparent HA + load spreading for the Halo routers.
# Deployed to /etc/haproxy/haproxy.cfg on BOTH halos (identical file).
# Listens on the keepalived VIP only (192.168.50.10:8080); each halo's
# local router also stays reachable on its own LAN IP for direct/debug use.
# Both up  -> least-conn spreading (two clients = two full-speed instances)
# One down -> health check pulls it in ~2s; VIP fails over via VRRP if needed

global
    log /dev/log daemon
    maxconn 512

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  300s      # long streams (SSE tool loops)
    timeout server  300s
    timeout queue   10s

frontend llamas
    bind 192.168.50.10:8081
    # Capability lane (2026-08-24): model-NAME routing to the heterogeneous
    # backend (traddy: Qwen3.6-35B-A3B / Gemma4 / LFM / Qwopus families).
    # req.body inspection sees the first request buffer (16k): bodies that
    # fit are matched WHOLE (key order irrelevant — verified), and larger
    # ones match whenever the model field lands in the first buffer — true
    # for every standard client (model is the first JSON key). Only a
    # >16k body with model buried past the buffer would miss and fall
    # through to the halos (model-not-found = loud) — deterministic escape
    # hatch: the explicit lane port :8083 below.
    option http-buffer-request
    acl lane_traddy req.body -m reg -i "Qwen-35B|Qwopus|Gemma4|LFM"
    use_backend traddy if lane_traddy
    default_backend halos

# explicit lane port — same backend, zero body-inspection ambiguity
frontend lane_traddy
    bind 192.168.50.10:8083
    default_backend traddy

backend traddy
    option  httpchk GET /health
    http-check expect string '"status":"ok"'
    # traddy cold-loads are ~165 s (38 GB Q8): slow inter + fall 2 so a
    # lazy load never flaps the backend DOWN
    default-server inter 5s fall 2 rise 2
    timeout server 30m
    http-response set-header X-Fleet-Lane traddy
    server traddy 192.168.50.209:1234 check

backend halos
    balance leastconn
    # Session affinity (operator request 2026-08-24): every client IP pins to
    # ONE halo -> warm KV prefix cache, no steady-state bouncing. Distinct
    # clients still spread across halos by leastconn. On halo death the
    # survivor serves everyone (each client pays ONE re-prefill). Note: two
    # agents behind the same IP pin together (fine with np=1 keep-alive
    # agents; see FLEET-HA.md).
    stick-table type ip size 100k expire 24h
    stick on src
    option  httpchk GET /health
    http-check expect string '"status":"ok"'
    default-server inter 2s fall 1 rise 2
    # long non-streaming generations (deep thinking, 16k-token budgets) are
    # silent until the final burst: ~13 min at 20 t/s — must survive the proxy
    timeout server 30m
    http-response set-header X-Served-By %[srv_name]
    server halo1 127.0.0.1:8080 check
    server halo2 192.168.50.15:8080 check

# local stats (for the dashboard agent; loopback only)
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /

# fleet dashboard (VIP:8082) — same HA pattern as the API
frontend dash
    bind 192.168.50.10:8082
    default_backend dashb

backend dashb
    balance leastconn
    option  httpchk GET /
    default-server inter 5s fall 1 rise 2
    server halo1 192.168.50.184:8082 check
    server halo2 192.168.50.15:8082 check
