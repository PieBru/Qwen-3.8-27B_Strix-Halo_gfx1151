# fleet/haproxy.cfg — transparent HA + load spreading for the Halo routers.
# Deployed to /etc/haproxy/haproxy.cfg on BOTH halos (identical file).
# Listens on the keepalived VIP only (192.168.50.10:8080); each halo's
# local router also stays reachable on its own LAN IP for direct/debug use.
# Both up  -> least-conn spreading (two clients = two full-speed instances)
# One down -> health check pulls it in ~2s; VIP fails over via VRRP if needed

global
    log /dev/log daemon
    maxconn 512

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  300s      # long streams (SSE tool loops)
    timeout server  300s
    timeout queue   10s

frontend llamas
    bind 192.168.50.10:8081
    default_backend halos

backend halos
    balance leastconn
    option  httpchk GET /health
    http-check expect string '"status":"ok"'
    default-server inter 2s fall 1 rise 2
    server halo1 127.0.0.1:8080 check
    server halo2 192.168.50.15:8080 check
